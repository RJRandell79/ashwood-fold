name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  harness:
    name: Harness (5 seeds x 30 years)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Balance report and invariants
        run: node harness/run.mjs --seeds 1,11,23,42,77 --years 30 --json harness-report.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: harness-report
          path: harness-report.json

  build:
    name: Build single-file page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: ashwood-fold-html
          path: dist/ashwood-fold.html

  compare:
    name: Behaviour vs base branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          path: base
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Compare 20 villages x 30 years with the base branch
        run: node harness/compare.mjs --base base --seeds 20 --years 30 --markdown compare.md
      - name: Add the report to the job summary
        if: always()
        run: test -f compare.md && cat compare.md >> "$GITHUB_STEP_SUMMARY" || true
